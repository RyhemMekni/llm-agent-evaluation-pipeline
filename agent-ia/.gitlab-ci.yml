stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-B -DskipTests"

cache:
  paths:
    - agent-ia/.m2/repository/

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd agent-ia
    - mvn $MAVEN_CLI_OPTS clean compile
  artifacts:
    paths:
      - agent-ia/target/classes/
    expire_in: 1 hour

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd agent-ia
    - mvn -B test
  artifacts:
    when: always
    paths:
      - agent-ia/target/surefire-reports/
    reports:
      junit: agent-ia/target/surefire-reports/TEST-*.xml