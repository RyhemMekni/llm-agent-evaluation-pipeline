stages:
  - build
  - test
  - evaluate
  - sast

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-B -DskipTests"

cache:
  paths:
    - agent-ia/.m2/repository/
    - agent-evaluateur/.m2/repository/

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd agent-ia
    - mvn $MAVEN_CLI_OPTS clean compile

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd agent-ia
    - mvn -B test

llm-as-judge:
  stage: evaluate
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "=== LLM-as-Judge - Smoke test A2A (1 cas rapide) ==="

    - cd agent-ia
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8080" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8080/api/agent/health && break || sleep 10; done
    - curl -f http://localhost:8080/api/agent/health || exit 1
    - echo "Agent 1 operationnel sur port 8080"

    - cd ../agent-evaluateur
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8081" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8081/api/evaluateur/health && break || sleep 10; done
    - curl -f http://localhost:8081/api/evaluateur/health || exit 1
    - echo "Agent 2 (Evaluateur) operationnel sur port 8081"

    - echo "=== Test smoke - 1 cas ==="
    - curl -f "http://localhost:8081/api/evaluateur/evaluer?testId=CI-SMOKE&question=Qu%27est-ce%20que%20le%20SAST%3F&contexte=SAST%20designe%20l%27analyse%20statique%20du%20code" || exit 1
    - echo "Smoke test A2A termine avec succes"
  timeout: 20m
  allow_failure: true

llm-as-judge-batch:
  stage: evaluate
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "=== LLM-as-Judge - BATCH COMPLET (10 cas du dataset) ==="

    - cd agent-ia
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8080" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8080/api/agent/health && break || sleep 10; done
    - curl -f http://localhost:8080/api/agent/health || exit 1

    - cd ../agent-evaluateur
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8081" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8081/api/evaluateur/health && break || sleep 10; done
    - curl -f http://localhost:8081/api/evaluateur/health || exit 1

    - echo "=== Execution du batch sur 10 cas ==="
    - curl -f --max-time 600 http://localhost:8081/api/evaluateur/batch -o batch-result.json || exit 1
    - echo "=== Resultats ==="
    - cat batch-result.json
  when: manual
  timeout: 30m
  allow_failure: true

sonarqube-sast:
  stage: sast
  image: maven:3.9-eclipse-temurin-21
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: 0
  script:
    - echo "=== SAST - Analyse SonarQube ==="
    - cd agent-ia
    - mvn clean verify sonar:sonar
        -DskipTests
        "-Dsonar.projectKey=agent-ia"
        "-Dsonar.projectName=agent-ia"
        "-Dsonar.host.url=${SONAR_HOST_URL}"
        "-Dsonar.token=${SONAR_TOKEN}"
        "-Dsonar.qualitygate.wait=false"
        "-Dsonar.scm.provider=git"
  allow_failure: true

dependency-check:
  stage: sast
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "=== OWASP Dependency-Check ==="
    - cd agent-ia
    - mvn org.owasp:dependency-check-maven:10.0.4:check
        -DskipTests
        "-DfailBuildOnCVSS=11"
        "-DnvdApiKey=${NVD_API_KEY}"
        "-DnvdApiDelay=6000"
        "-DossindexAnalyzerEnabled=false"
        "-DknownExploitedEnabled=false"
        "-DassemblyAnalyzerEnabled=false"
    - echo "=== Dependency-Check termine ==="
  timeout: 45m
  allow_failure: true