stages:
  - build
  - test
  - evaluate
  - sast
  - dast
  - report

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "-B -DskipTests"

cache:
  paths:
    - agent-ia/.m2/repository/
    - agent-evaluateur/.m2/repository/

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd agent-ia
    - mvn $MAVEN_CLI_OPTS clean compile

test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd agent-ia
    - mvn -B test
  artifacts:
    when: always
    reports:
      junit:
        - agent-ia/target/surefire-reports/TEST-*.xml

llm-as-judge:
  stage: evaluate
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "=== LLM-as-Judge - Smoke test A2A (1 cas rapide) ==="

    - cd agent-ia
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8080" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8080/api/agent/health && break || sleep 10; done
    - curl -f http://localhost:8080/api/agent/health || exit 1
    - echo "Agent 1 operationnel sur port 8080"

    - cd ../agent-evaluateur
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8081" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8081/api/evaluateur/health && break || sleep 10; done
    - curl -f http://localhost:8081/api/evaluateur/health || exit 1
    - echo "Agent 2 (Evaluateur) operationnel sur port 8081"

    - echo "=== Test smoke - 1 cas ==="
    - curl -f "http://localhost:8081/api/evaluateur/evaluer?testId=CI-SMOKE&question=Qu%27est-ce%20que%20le%20SAST%3F&contexte=SAST%20designe%20l%27analyse%20statique%20du%20code" || exit 1
    - echo "Smoke test A2A termine avec succes"
  timeout: 20m
  allow_failure: true

llm-as-judge-batch:
  stage: evaluate
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "=== LLM-as-Judge - BATCH COMPLET (10 cas du dataset) ==="

    - cd agent-ia
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8080" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8080/api/agent/health && break || sleep 10; done
    - curl -f http://localhost:8080/api/agent/health || exit 1

    - cd ../agent-evaluateur
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8081" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8081/api/evaluateur/health && break || sleep 10; done
    - curl -f http://localhost:8081/api/evaluateur/health || exit 1

    - echo "=== Execution du batch sur 10 cas ==="
    - curl -f --max-time 600 http://localhost:8081/api/evaluateur/batch -o batch-result.json || exit 1
    - echo "=== Resultats ==="
    - cat batch-result.json
  when: manual
  timeout: 30m
  allow_failure: true

sonarqube-sast:
  stage: sast
  image: maven:3.9-eclipse-temurin-21
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: 0
  script:
    - echo "=== SAST - Analyse SonarQube ==="
    - cd agent-ia
    - mvn clean verify sonar:sonar
        -DskipTests
        "-Dsonar.projectKey=agent-ia"
        "-Dsonar.projectName=agent-ia"
        "-Dsonar.host.url=${SONAR_HOST_URL}"
        "-Dsonar.token=${SONAR_TOKEN}"
        "-Dsonar.qualitygate.wait=false"
        "-Dsonar.scm.provider=git"
  allow_failure: true

dependency-check:
  stage: sast
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "=== OWASP Dependency-Check ==="
    - cd agent-ia
    - mvn org.owasp:dependency-check-maven:10.0.4:check
        -DskipTests
        "-DfailBuildOnCVSS=11"
        "-DnvdApiKey=${NVD_API_KEY}"
        "-DnvdApiDelay=6000"
        "-DossindexAnalyzerEnabled=false"
        "-DknownExploitedEnabled=false"
        "-DassemblyAnalyzerEnabled=false"
    - echo "=== Dependency-Check termine ==="
  timeout: 45m
  allow_failure: true


dast-zap:
  stage: dast
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "=== DAST - OWASP ZAP scan ==="
    - apt-get update -qq && apt-get install -y -qq iproute2 > /dev/null

    - cd agent-ia
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8080" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8080/api/agent/health && break || sleep 10; done
    - curl -f http://localhost:8080/api/agent/health || exit 1
    - echo "Agent IA operationnel sur port 8080"

    - TARGET_IP=$(hostname -i)
    - TARGET_URL="http://${TARGET_IP}:8080/api/agent/health"
    - echo "Cible ZAP = ${TARGET_URL}"

    - curl -sf "http://zap:8090/JSON/core/action/newSession/?name=ci-scan&overwrite=true"

    - echo "=== Spider ==="
    - SPIDER_ID=$(curl -s "http://zap:8090/JSON/spider/action/scan/?url=${TARGET_URL}&recurse=true" | grep -oP '"scan":"\K[0-9]+')
    - echo "Spider scanId=${SPIDER_ID}"
    - |
      for i in $(seq 1 30); do
        STATUS=$(curl -s "http://zap:8090/JSON/spider/view/status/?scanId=${SPIDER_ID}" | grep -oP '"status":"\K[0-9]+')
        echo "Spider status=${STATUS}%"
        [ "$STATUS" = "100" ] && break
        sleep 5
      done

    - echo "=== Active Scan ==="
    - ASCAN_ID=$(curl -s "http://zap:8090/JSON/ascan/action/scan/?url=${TARGET_URL}" | grep -oP '"scan":"\K[0-9]+')
    - echo "Active scan scanId=${ASCAN_ID}"
    - |
      for i in $(seq 1 60); do
        STATUS=$(curl -s "http://zap:8090/JSON/ascan/view/status/?scanId=${ASCAN_ID}" | grep -oP '"status":"\K[0-9]+')
        echo "Active scan status=${STATUS}%"
        [ "$STATUS" = "100" ] && break
        sleep 10
      done

    - echo "=== Resultats ZAP ==="
    - curl -s "http://zap:8090/JSON/core/view/alerts/?baseurl=${TARGET_URL}"
  timeout: 30m
  allow_failure: true


prompt-injection-test:
  stage: dast
  image: maven:3.9-eclipse-temurin-21
  script:
    - echo "=== US12 - Tests Prompt Injection ==="

    - cd agent-ia
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8080" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8080/api/agent/health && break || sleep 10; done
    - curl -f http://localhost:8080/api/agent/health || exit 1
    - echo "Agent 1 operationnel sur port 8080"

    - cd ../agent-evaluateur
    - mvn spring-boot:run
        "-Dspring.ai.openai.api-key=${GROQ_API_KEY}"
        "-Dspring.ai.openai.base-url=https://api.groq.com/openai/v1"
        "-Dspring.ai.openai.chat.model=openai/gpt-oss-120b"
        "-Dserver.port=8081" &
    - for i in $(seq 1 20); do curl -sf http://localhost:8081/api/evaluateur/health && break || sleep 10; done
    - curl -f http://localhost:8081/api/evaluateur/health || exit 1
    - echo "Agent 2 (Evaluateur) operationnel sur port 8081"

    - echo "=== Execution du batch prompt injection (10 cas) ==="
    - curl -f --max-time 600 http://localhost:8081/api/evaluateur/prompt-injection -o prompt-injection-result.json || exit 1
    - echo "=== Resultats ==="
    - cat prompt-injection-result.json
  when: manual
  timeout: 30m
  allow_failure: true


consolidated-report:
  stage: report
  image: maven:3.9-eclipse-temurin-21
  script:
    - "echo ============================================="
    - "echo RAPPORT CONSOLIDE QUALITE ET SECURITE"
    - "echo Pipeline ID = ${CI_PIPELINE_ID}"
    - "echo Commit = ${CI_COMMIT_SHORT_SHA}"
    - "date -u"
    - "echo ============================================="
    - "echo QUALITE - Build et Tests"
    - "echo Build : voir job build"
    - "echo Tests unitaires : voir job test"
    - "echo MODEL EVALUATION - LLM as a judge"
    - "echo Smoke test A2A : voir job llm-as-judge"
    - "echo Batch complet : voir job llm-as-judge-batch manuel"
    - "echo SAST - Analyse statique"
    - "echo SonarQube : voir job sonarqube-sast"
    - "echo OWASP Dependency-Check : voir job dependency-check"
    - "echo DAST - Analyse dynamique"
    - "echo OWASP ZAP : voir job dast-zap"
    - "echo Prompt Injection : voir job prompt-injection-test manuel"
    - "echo ============================================="
    - "echo Consulter chaque job dans l onglet Jobs de ce pipeline"
    - "echo ============================================="
  allow_failure: true
  when: always