
spring.application.name=agent-ia

#spring.ai.openai.api-key=***REMOVED***
#spring.ai.openai.api-key=***REMOVED***
spring.ai.openai.api-key=***REMOVED***

spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-120b



# ===== MCP Client — connexion au serveur mcp-server-websearch =====
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=agent-ia-mcp-client
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=60s
spring.ai.mcp.client.initialized=false

# Auto-enregistrement des tools MCP comme ToolCallback Spring AI
spring.ai.mcp.client.toolcallback.enabled=true

# Serveur MCP web search (transport HTTP)
spring.ai.mcp.client.streamable-http.connections.websearch.url=http://localhost:8060
spring.ai.mcp.client.streamable-http.connections.websearch.endpoint=/mcp